[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gps-emi"
version = "0.1.0"
description = "Monitor de llegada de una ambulancia EMI mediante Zones"
requires-python = ">=3.10"
dependencies = ["requests>=2.34,<2.35", "python-dotenv>=1.2,<1.3", "Flask>=3.1,<3.2", "waitress>=3.0,<3.1", "tzdata>=2026.4,<2027"]

[project.scripts]
gps-emi = "gps_emi.cli:main"
gps-emi-whatsapp = "gps_emi.whatsapp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
