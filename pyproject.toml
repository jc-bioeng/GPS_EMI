[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gps-emi"
version = "0.1.0"
description = "Monitor de llegada de una ambulancia EMI mediante Zones"
requires-python = ">=3.10"
dependencies = ["requests", "python-dotenv"]

[project.scripts]
gps-emi = "gps_emi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
